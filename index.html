<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Like A Black Bird!</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #d8e4f0; overflow: hidden; }
    @keyframes btn-glow {
      0%, 100% { transform: scale(1);    box-shadow: 0 6px 28px rgba(247,37,133,0.45); }
      50%       { transform: scale(1.05); box-shadow: 0 10px 40px rgba(247,37,133,0.8); }
    }
    @keyframes badge-pop {
      0%, 100% { transform: scale(1); }
      50%       { transform: scale(1.08); }
    }
    #menu-swipe { animation: btn-glow 1.4s ease-in-out infinite; display: inline-block; }
    #menu-badge { animation: badge-pop 2s ease-in-out infinite; display: inline-block; }
    body { display: flex; align-items: center; justify-content: center; }
    #game { display: block; touch-action: none; cursor: pointer; }
  </style>
</head>
<body>
<div id="game-container" style="position: relative; display: inline-block;">
  <canvas id="game" style="display: block;"></canvas>

  <!-- ── Menu / Hook screen — TikTok style ───────────────── -->
  <div id="menu-screen" style="display:none; position:absolute; top:0; left:0; width:480px; height:854px; transform-origin:top left; overflow:hidden; font-family:'Arial Black',Arial,sans-serif;">

    <!-- Fullscreen background video -->
    <video id="hookVideo" src="assets/black-bird-head-clean.mp4" autoplay loop muted playsinline
      style="position:absolute; top:0; left:0; width:100%; height:100%; object-fit:cover; z-index:0;"></video>

    <!-- Gradient: dark top + dark bottom for readability -->
    <div style="position:absolute; inset:0; background:linear-gradient(to bottom, rgba(0,0,0,0.72) 0%, rgba(0,0,0,0.05) 42%, rgba(0,0,0,0.05) 58%, rgba(0,0,0,0.78) 100%); z-index:1;"></div>

    <!-- CENTER: all content in one flex column -->
    <div style="position:absolute; inset:0; z-index:2; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:0 40px; gap:0;">

      <!-- Hype badge -->
      <div id="menu-badge" style="display:inline-block; background:rgba(255,45,85,0.92); color:#fff; font:bold 11px Arial; letter-spacing:2.5px; text-transform:uppercase; padding:5px 16px; border-radius:30px; margin-bottom:16px;">🔥 FREE TO PLAY</div>

      <!-- Game title -->
      <div style="font:900 58px 'Arial Black',Arial; color:#fff; line-height:0.9; text-transform:uppercase; text-shadow:0 4px 20px rgba(0,0,0,0.6); letter-spacing:-1px;">Like A</div>
      <div style="font:900 58px 'Arial Black',Arial; color:#fff; line-height:0.9; text-transform:uppercase; text-shadow:0 4px 20px rgba(0,0,0,0.6); letter-spacing:-1px; margin-bottom:24px;">Black Bird!</div>

      <!-- How to play -->
      <div style="font:600 16px Arial; color:rgba(255,255,255,0.93); line-height:1.75; text-shadow:0 1px 8px rgba(0,0,0,0.8); margin-bottom:36px;">
        catch falling drumsticks 🍗<br>
        grow ur neck to the moon 🚀<br>
        <span style="font-size:14px; color:rgba(255,255,255,0.65);">👈 swipe left &amp; right to dodge 👉</span>
      </div>

      <!-- CTA button -->
      <div id="menu-swipe"
        style="display:block; width:100%; background:linear-gradient(135deg,#ff6b35 0%,#f72585 100%); color:#fff; font:900 22px 'Arial Black',Arial; padding:20px 0; border-radius:50px; letter-spacing:1px; cursor:pointer; -webkit-tap-highlight-color:transparent; box-sizing:border-box;">
        LET'S GO &nbsp;🔥
      </div>
      <div style="margin-top:12px; font:600 12px Arial; color:rgba(255,255,255,0.45); letter-spacing:1.5px; text-transform:uppercase;">or swipe anywhere</div>

    </div>

  </div>

  <div id="over-screen" style="display:none; position:absolute; top:0; left:0; width:480px; height:854px; transform-origin:top left; flex-direction:column; align-items:center; justify-content:center; gap:14px; background:rgba(214,230,250,0.96); font-family:Arial,sans-serif;">
    <div style="font:bold 58px Arial; color:#1a1a3a; line-height:1;">Oops!</div>
    <div id="over-score-text" style="font:28px Arial; color:#222; margin-top:4px;"></div>
    <div id="over-combo-text" style="font:21px Arial; color:#666;"></div>
    <video id="danceVideo" src="assets/black-bird-dance.mp4" playsinline loop style="width:380px; height:300px; object-fit:cover; border-radius:18px; flex-shrink:0; margin-top:8px;"></video>
    <button id="eat-again-btn" style="margin-top:16px; width:230px; height:58px; border-radius:29px; border:none; background:#2a2a4a; color:#fff; font:bold 22px Arial; cursor:pointer; -webkit-tap-highlight-color:transparent;">Eat Again</button>
  </div>
</div>
<script>
'use strict';

/* ─── Canvas ──────────────────────────────────────────────────────────────── */
const canvas = document.getElementById('game');
const ctx    = canvas.getContext('2d');
const W = 480, H = 854;
canvas.width = W; canvas.height = H;

function resize() {
  const s = Math.min(window.innerWidth / W, window.innerHeight / H);
  canvas.style.width  = W * s + 'px';
  canvas.style.height = H * s + 'px';
  const over = document.getElementById('over-screen');
  if (over) over.style.transform = `scale(${s})`;
  const menu = document.getElementById('menu-screen');
  if (menu) menu.style.transform = `scale(${s})`;
}
resize();
window.addEventListener('resize', resize);

// Drumstick takes 7 beats to fall from top to catch line
const FALL_SPD = (CATCH_Y + 90) / (BEAT_MS * 7 / 1000);  // px/s ≈ 160

/* ─── State machine ───────────────────────────────────────────────────────── */
const S = { MENU: 0, PLAY: 1, MISS: 2, OVER: 3 };
let state = S.MENU;

let birdX    = W / 2;
let segs     = 0;         // neck segment count
let score    = 0;
let coins    = 0;
let combo    = 0;
let maxCombo = 0;
let revived  = false;     // one free revive used?

let notes      = [];      // falling drumsticks
let combofx    = [];      // combo text particles
let lastSpawn  = 0;
let spawnInt   = BEAT_MS * 2;
let missTimer  = 0;
let lastTime   = 0;

/* ─── Drawing helpers ─────────────────────────────────────────────────────── */
function drawBg() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#f5f8ff');
  g.addColorStop(1, '#e4ecf8');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(180,200,230,0.4)';
  for (let x = 32; x < W; x += 40)
    for (let y = 32; y < H; y += 40) {
      ctx.beginPath(); ctx.arc(x, y, 1.5, 0, Math.PI * 2); ctx.fill();
    }
}

function drawCatchLine() {
  ctx.save();
  ctx.setLineDash([14, 9]);
  ctx.strokeStyle = 'rgba(130,155,210,0.65)';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(20, CATCH_Y); ctx.lineTo(W - 20, CATCH_Y);
  ctx.stroke();
  ctx.restore();
}

// Falling drumstick note
function drawNote(n) {
  ctx.save();
  ctx.translate(n.x, n.y);
  ctx.rotate(n.a);
  const r = n.r;
  
  if (IMG.drumstick && IMG.drumstick.naturalWidth) {
    const dw = r * 1.1;
    const dh = r * 1.1 * (IMG.drumstick.naturalHeight / IMG.drumstick.naturalWidth);
    ctx.drawImage(IMG.drumstick, -dw/2, -dh/2, dw, dh);
  } else {
    // fallback meat
    ctx.beginPath();
    ctx.ellipse(0, -r * .14, r * .40, r * .28, 0, 0, Math.PI * 2);
    ctx.fillStyle = '#e8832a'; ctx.fill();
    ctx.strokeStyle = '#7a3010'; ctx.lineWidth = 1.8; ctx.stroke();
    // handle
    ctx.beginPath();
    ctx.roundRect(-r*.07, -r*.03, r*.14, r*.54, r*.07);
    ctx.fillStyle = '#f5e6c8'; ctx.fill();
    ctx.strokeStyle = '#c0a06a'; ctx.lineWidth = 1.4; ctx.stroke();
    // end knob
    ctx.beginPath();
    ctx.ellipse(0, r*.51, r*.13, r*.09, 0, 0, Math.PI * 2);
    ctx.fillStyle = '#f5e6c8'; ctx.fill();
    ctx.strokeStyle = '#c0a06a'; ctx.stroke();
  }
  ctx.restore();
}

// One neck segment = one drumstick ring: crossed bones + single meat oval
// Matches the reference image: X-crossbones with meat puff in the centre
function drawSeg(cx, cy, w) {
  ctx.save();
  ctx.translate(cx, cy);
  
  // Make the caught drumstick look like a single doodle-style drumstick
  // scaling it up to match the neck proportion.
  // The meat width is about 0.8 * r. We want it to be close to w (72px).
  const r = w * 1.0; // r ~ 72, which makes width ~ 58px.

  if (IMG.drumstick && IMG.drumstick.naturalWidth) {
    const dw = r * 1.1;
    const dh = r * 1.1 * (IMG.drumstick.naturalHeight / IMG.drumstick.naturalWidth);
    ctx.drawImage(IMG.drumstick, -dw/2, -dh/2, dw, dh);
  } else {
    // fallback meat
    ctx.beginPath();
    ctx.ellipse(0, -r * .14, r * .40, r * .28, 0, 0, Math.PI * 2);
    ctx.fillStyle = '#e8832a'; ctx.fill();
    ctx.strokeStyle = '#7a3010'; ctx.lineWidth = 1.8; ctx.stroke();
    
    // fallback handle
    ctx.beginPath();
    ctx.roundRect(-r*.07, -r*.03, r*.14, r*.54, r*.07);
    ctx.fillStyle = '#f5e6c8'; ctx.fill();
    ctx.strokeStyle = '#c0a06a'; ctx.lineWidth = 1.4; ctx.stroke();
    
    // fallback end knob
    ctx.beginPath();
    ctx.ellipse(0, r*.51, r*.13, r*.09, 0, 0, Math.PI * 2);
    ctx.fillStyle = '#f5e6c8'; ctx.fill();
    ctx.strokeStyle = '#c0a06a'; ctx.stroke();
  }
  ctx.restore();
}

// Computed rendered bird height
function birdRH() {
  return IMG.bird.naturalWidth ? BIRD_RW / IMG.bird.naturalWidth * IMG.bird.naturalHeight : 253;
}

// Draw only the head portion of the bird sprite (clipped to top HEAD_FRAC)
function drawHead(cx, headBottomY) {
  const rh  = birdRH();
  const topY = headBottomY - rh * HEAD_FRAC;
  if (IMG.bird.naturalWidth) {
    ctx.save();
    ctx.beginPath();
    ctx.rect(cx - BIRD_RW / 2 - 5, topY - 5, BIRD_RW + 10, rh * HEAD_FRAC + 10);
    ctx.clip();
    ctx.drawImage(IMG.bird, cx - BIRD_RW / 2, topY, BIRD_RW, rh);
    ctx.restore();
  } else {
    // fallback
    ctx.fillStyle = '#111';
    ctx.beginPath(); ctx.ellipse(cx, headBottomY - 38, 40, 44, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.ellipse(cx-14, headBottomY-52, 9, 7, -.3, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx+6,  headBottomY-54, 9, 7,  .2, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#e8a020';
    ctx.beginPath(); ctx.moveTo(cx-6,headBottomY-44); ctx.lineTo(cx+12,headBottomY-47); ctx.lineTo(cx+2,headBottomY-38); ctx.fill();
  }
}

// Draw only the body portion of the bird sprite (from BODY_FRAC down)
function drawBody(cx, bodyTopY) {
  if (!IMG.bird.naturalWidth) {
    ctx.fillStyle = '#111';
    ctx.beginPath(); ctx.ellipse(cx, bodyTopY + 50, 50, 58, 0, 0, Math.PI * 2); ctx.fill();
    return;
  }
  const rh   = birdRH();
  const ih   = IMG.bird.naturalHeight;
  const srcY = ih * BODY_FRAC;
  const srcH = ih * (1 - BODY_FRAC);
  const dstH = rh * (1 - BODY_FRAC);
  ctx.drawImage(IMG.bird,
    0, srcY, IMG.bird.naturalWidth, srcH,
    cx - BIRD_RW / 2, bodyTopY, BIRD_RW, dstH);
}

/* ─── Scene renderers ─────────────────────────────────────────────────────── */
function renderGame() {
  drawBg();
  drawCatchLine();

  const headBottom = CATCH_Y;                    // bottom of head = catch line
  const bodyTop    = CATCH_Y + segs * SEG_H;     // body below all segments

  // neck segments
  for (let i = 0; i < segs; i++)
    drawSeg(birdX, CATCH_Y + (i + .5) * SEG_H, 72);

  drawHead(birdX, headBottom);
  drawBody(birdX, bodyTop);

  // falling notes
  for (const n of notes) drawNote(n);

  // combo text particles
  for (const t of combofx) {
    ctx.save();
    ctx.globalAlpha = Math.max(0, t.life);
    ctx.font = `bold ${18 + Math.min(t.c, 10)}px 'Arial Rounded MT Bold', Arial`;
    ctx.textAlign = 'center';
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 4;
    ctx.strokeText(t.text, t.x, t.y);
    ctx.fillStyle = '#e8832a';
    ctx.fillText(t.text, t.x, t.y);
    ctx.restore();
  }

  renderHUD();
}

function renderHUD() {
  ctx.textAlign = 'left';
  ctx.font = 'bold 30px Arial';
  ctx.fillStyle = '#2a2a4a';
  ctx.fillText(score, 22, 50);
  ctx.font = '13px Arial';
  ctx.fillStyle = '#8888bb';
  ctx.fillText('SCORE', 22, 66);

  // Coins removed

  // pause
  ctx.fillStyle = 'rgba(70,70,120,0.15)';
  ctx.beginPath(); ctx.roundRect(18, H - 62, 46, 46, 12); ctx.fill();
  ctx.textAlign = 'center';
  ctx.font = '22px Arial';
  ctx.fillStyle = '#5a5a9a';
  ctx.fillText('⏸', 41, H - 33);
}

function renderMenu() {
  drawBg(); // HTML overlay (#menu-screen) handles title/video/prompt
}

function renderMiss() {
  renderGame();
  ctx.fillStyle = 'rgba(255,255,255,0.80)';
  ctx.beginPath(); ctx.roundRect(W/2 - 156, H/2 - 90, 312, 180, 24); ctx.fill();
  ctx.textAlign = 'center';
  ctx.font = 'bold 24px Arial'; ctx.fillStyle = '#2a2a4a';
  ctx.fillText("It's OK, Not To Be OK!", W / 2, H / 2 - 28);
  ctx.font = '19px Arial'; ctx.fillStyle = '#5a5a9a';
  ctx.fillText(revived ? 'Tap for Score Summary' : 'Swipe to Continue!', W / 2, H / 2 + 22);
}

function renderOver() {
  drawBg();
}

function renderBottomNav() {
  // Removed Love Story and Mood
}

/* ─── Update ──────────────────────────────────────────────────────────────── */
const COMBO_LABELS = ['Good!', 'Nice!', 'Perfect!', 'Brilliant!', 'Marvelous!', 'Phenomenal!', 'LEGENDARY!'];

function update(dt, now) {
  if (state === S.MISS) {
    missTimer += dt;
    if (missTimer > 5 && revived) { endGame(); }
    return;
  }
  if (state !== S.PLAY) return;

  // spawn
  if (now - lastSpawn >= spawnInt) {
    const margin = 60;
    notes.push({
      x: margin + Math.random() * (W - margin * 2),
      y: -80,
      r: 48 + Math.random() * 10, // slightly smaller falling drumsticks
      a: Math.random() * Math.PI * 2,
      spin: (Math.random() - .5) * 3.5,
    });
    lastSpawn = now;
    spawnInt = Math.max(BEAT_MS * .80, spawnInt - .6);
  }

  // notes
  for (let i = notes.length - 1; i >= 0; i--) {
    const n = notes[i];
    n.y += FALL_SPD * dt;
    n.a += n.spin * dt;
    const dx = n.x - birdX, dy = n.y - CATCH_Y;
    if (Math.sqrt(dx * dx + dy * dy) < HIT_R) {
      onCatch(); notes.splice(i, 1); continue;
    }
    if (n.y > CATCH_Y + HIT_R + 24) { onMiss(); notes.splice(i, 1); }
  }

  // fx
  for (let i = combofx.length - 1; i >= 0; i--) {
    combofx[i].life -= dt * 1.4;
    combofx[i].y    -= 26 * dt;
    if (combofx[i].life <= 0) combofx.splice(i, 1);
  }
}

/* ─── Crispy crunch SFX (Web Audio synthesis) ─────────────────────────────── */
let audioCtx = null;

function playCrunch() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();

  const dur  = 0.14;
  const buf  = audioCtx.createBuffer(1, audioCtx.sampleRate * dur, audioCtx.sampleRate);
  const data = buf.getChannelData(0);
  // layered noise: fast crackle + low thud
  for (let i = 0; i < data.length; i++) {
    const t    = i / audioCtx.sampleRate;
    const env  = Math.pow(1 - t / dur, 2.5);           // sharp decay
    const crackle = (Math.random() * 2 - 1) * env;     // white noise crackle
    const thud    = Math.sin(2 * Math.PI * 180 * t) * env * 0.35; // low body
    data[i] = crackle * 0.65 + thud;
  }

  const src = audioCtx.createBufferSource();
  src.buffer = buf;

  // Bandpass: emphasise the high-mid crunch frequencies
  const bp = audioCtx.createBiquadFilter();
  bp.type = 'bandpass';
  bp.frequency.value = 3500;
  bp.Q.value = 0.6;

  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(0.55, audioCtx.currentTime);

  src.connect(bp); bp.connect(gain); gain.connect(audioCtx.destination);
  src.start();
}

function onCatch() {
  score++; combo++;
  maxCombo = Math.max(maxCombo, combo);
  segs++;
  playCrunch();
  const label = COMBO_LABELS[Math.min(Math.floor(combo / 3), COMBO_LABELS.length - 1)];
  combofx.push({ text: label, x: birdX, y: CATCH_Y - 75, life: 1, c: combo });
  if (music && music.paused) music.play().catch(() => {});
}

function onMiss() {
  if (state !== S.PLAY) return;
  combo = 0;
  state = S.MISS;
  missTimer = 0;
  if (music) music.pause();
}

function endGame() {
  coins += score;
  state = S.OVER;
  if (music) music.pause();
  const over = document.getElementById('over-screen');
  if (over) {
    document.getElementById('over-score-text').textContent = 'Score: ' + score;
    document.getElementById('over-combo-text').textContent = 'Best Combo: ' + maxCombo + 'x';
    over.style.display = 'flex';
    resize(); // re-apply scale
  }
  const vid = document.getElementById('danceVideo');
  if (vid) { vid.currentTime = 0; vid.play().catch(() => {}); }
}

/* ─── Input ───────────────────────────────────────────────────────────────── */
let drag = false, lastPx = 0;

function clientX(e) {
  const r = canvas.getBoundingClientRect();
  return ((e.touches ? e.touches[0].clientX : e.clientX) - r.left) * (W / r.width);
}
function clientY(e) {
  const r = canvas.getBoundingClientRect();
  return ((e.touches ? e.touches[0].clientY : e.clientY) - r.top) * (H / r.height);
}

function onDown(e) {
  e.preventDefault();
  drag = true; lastPx = clientX(e);
  if (state === S.MENU) { startGame(); return; }
  if (state === S.MISS) {
    if (revived) { endGame(); }
    else { revived = true; state = S.PLAY; if (music) music.play().catch(() => {}); }
    return;
  }
  // OVER state handled by #eat-again-btn HTML button
}

function onMove(e) {
  e.preventDefault();
  if (!drag) return;
  const x = clientX(e);
  birdX = Math.max(40, Math.min(W - 40, birdX + x - lastPx));
  lastPx = x;
}

function onUp() { drag = false; }

canvas.addEventListener('mousedown',  onDown, { passive: false });
canvas.addEventListener('touchstart', onDown, { passive: false });
canvas.addEventListener('mousemove',  onMove, { passive: false });
canvas.addEventListener('touchmove',  onMove, { passive: false });
canvas.addEventListener('mouseup',    onUp);
canvas.addEventListener('touchend',   onUp);
document.getElementById('eat-again-btn').addEventListener('click', startGame);

// menu-screen sits on top of canvas — forward interactions to startGame
const _menuEl = document.getElementById('menu-screen');
function _menuStart(e) { e.preventDefault(); startGame(); }
_menuEl.addEventListener('touchstart', _menuStart, { passive: false });
_menuEl.addEventListener('mousedown',  _menuStart);

/* ─── Game control ────────────────────────────────────────────────────────── */
function startGame() {
  birdX = W / 2; segs = 0; score = 0; combo = 0;
  notes = []; combofx = []; revived = false; missTimer = 0;
  spawnInt  = BEAT_MS * 2;
  lastSpawn = performance.now();
  state = S.PLAY;
  // Stop hook video (mute first to prevent audio bleed into game music)
  const hookVid = document.getElementById('hookVideo');
  if (hookVid) { hookVid.muted = true; hookVid.pause(); hookVid.currentTime = 0; }
  const over = document.getElementById('over-screen');
  if (over) over.style.display = 'none';
  const menu = document.getElementById('menu-screen');
  if (menu) menu.style.display = 'none';
  if (music) { music.currentTime = 0; music.play().catch(() => {}); }
  const vid = document.getElementById('danceVideo');
  if (vid) { vid.pause(); vid.currentTime = 0; }
}

/* ─── Main loop ───────────────────────────────────────────────────────────── */
function frame(ts) {
  const dt = Math.min((ts - lastTime) / 1000, .05);
  lastTime = ts;
  update(dt, ts);
  if      (state === S.MENU) renderMenu();
  else if (state === S.PLAY) renderGame();
  else if (state === S.MISS) renderMiss();
  else if (state === S.OVER) renderOver();
  requestAnimationFrame(frame);
}

/* ─── Boot ────────────────────────────────────────────────────────────────── */
loadAssets().then(() => {
  const menu = document.getElementById('menu-screen');
  if (menu) { menu.style.display = 'flex'; resize(); }
  // Try to play hook video with sound; fallback to muted if browser blocks autoplay
  const hookVid = document.getElementById('hookVideo');
  if (hookVid) {
    hookVid.play().catch(() => {
      hookVid.muted = true;
      hookVid.play().catch(() => {});
    });
  }
  requestAnimationFrame(ts => { lastTime = ts; requestAnimationFrame(frame); });
});
</script>
</body>
</html>
